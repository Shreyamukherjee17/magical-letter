<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="wandWood" x1="44" y1="44" x2="6" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b120c"/>
      <stop offset="25%" stop-color="#3d2716"/>
      <stop offset="50%" stop-color="#5a3d24"/>
      <stop offset="75%" stop-color="#382212"/>
      <stop offset="100%" stop-color="#735030"/>
    </linearGradient>
    <linearGradient id="wandHighlight" x1="44" y1="44" x2="6" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8a5c36"/>
      <stop offset="50%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#faedcd"/>
    </linearGradient>
    <filter id="tipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wand Shadow -->
  <path d="M7 7 L43 43 L41 45 L5 9 Z" fill="#000000" opacity="0.6"/>

  <!-- Wand Shaft -->
  <path d="M6 6 L42 42 L40 44 L5 7 Z" fill="url(#wandWood)"/>

  <!-- Elder Wand Knots / Spheres -->
  <circle cx="36" cy="36" r="3.2" fill="url(#wandWood)" stroke="#1a0f07" stroke-width="0.8"/>
  <circle cx="28" cy="28" r="2.8" fill="url(#wandWood)" stroke="#1a0f07" stroke-width="0.8"/>
  <circle cx="20" cy="20" r="2.3" fill="url(#wandWood)" stroke="#1a0f07" stroke-width="0.7"/>
  <circle cx="13" cy="13" r="1.8" fill="url(#wandWood)" stroke="#1a0f07" stroke-width="0.6"/>

  <!-- Wand Highlights -->
  <line x1="5.5" y1="5.5" x2="41" y2="41" stroke="url(#wandHighlight)" stroke-width="0.6" stroke-linecap="round" opacity="0.8"/>

  <!-- Glowing Wand Tip (Hotspot at 4,4) -->
  <circle cx="5" cy="5" r="2" fill="#ffd166" filter="url(#tipGlow)"/>
  <circle cx="5" cy="5" r="1" fill="#ffffff"/>
</svg>
