<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" fill="none">
  <defs>
    <!-- Dark Vintage Sepia/Emerald Ink Gradient -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f140a"/>
      <stop offset="50%" stop-color="#2d1c0e"/>
      <stop offset="100%" stop-color="#140d06"/>
    </linearGradient>
  </defs>

  <!-- Outer Ornate Filigree Flourishes -->
  <!-- Top Crest Cresting Ribbons -->
  <path d="M120 12 C135 4, 158 8, 172 18 C160 22, 145 20, 134 26 C155 30, 170 42, 175 58 C160 52, 142 54, 130 62 L120 45 L110 62 C98 54, 80 52, 65 58 C70 42, 85 30, 106 26 C95 20, 80 22, 68 18 C82 8, 105 4, 120 12 Z" fill="url(#inkGrad)"/>

  <!-- Main Shield Outline -->
  <path d="M120 38 
           C175 38, 206 54, 206 102 
           C206 178, 165 228, 120 248 
           C75 228, 34 178, 34 102 
           C34 54, 65 38, 120 38 Z" 
        fill="none" stroke="url(#inkGrad)" stroke-width="4.5"/>

  <!-- Inner Double Inset Border -->
  <path d="M120 46 
           C168 46, 196 60, 196 102 
           C196 170, 160 216, 120 236 
           C80 216, 44 170, 44 102 
           C44 60, 72 46, 120 46 Z" 
        fill="none" stroke="url(#inkGrad)" stroke-width="1.8" stroke-dasharray="6,2"/>

  <!-- Shield Quadrant Dividers -->
  <line x1="120" y1="46" x2="120" y2="236" stroke="url(#inkGrad)" stroke-width="3"/>
  <line x1="44" y1="112" x2="196" y2="112" stroke="url(#inkGrad)" stroke-width="3"/>

  <!-- QUADRANT 1: GRYFFINDOR LION (Top-Left) -->
  <g transform="translate(48, 50) scale(0.32)" fill="url(#inkGrad)">
    <path d="M85 30 C95 15, 115 15, 125 30 C135 45, 130 65, 115 75 C125 80, 135 95, 130 115 C125 130, 110 145, 95 150 C90 165, 75 180, 55 185 C45 175, 45 160, 55 150 C35 145, 25 130, 30 110 C35 95, 50 85, 65 85 C55 75, 55 55, 65 40 C72 32, 78 30, 85 30 Z"/>
    <!-- Lion Rampant Stance -->
    <path d="M120 50 L150 35 L140 60 L165 65 L145 80 L160 110 L135 105 L140 140 L115 125 L105 160 L85 135 L60 170 L70 130 L40 135 L60 110 L30 100 L60 85 Z"/>
  </g>

  <!-- QUADRANT 2: SLYTHERIN SERPENT (Top-Right) -->
  <g transform="translate(128, 50) scale(0.32)" fill="url(#inkGrad)">
    <path d="M110 25 C130 25, 145 40, 140 60 C135 75, 115 85, 95 95 C75 105, 65 120, 70 135 C75 155, 100 165, 125 155 C145 145, 155 125, 150 105 L165 105 C172 135, 155 165, 125 178 C90 190, 55 175, 48 140 C42 115, 58 92, 82 80 C105 68, 118 58, 115 45 C112 35, 102 32, 90 35 C78 38, 70 48, 70 60 L52 60 C52 40, 72 25, 110 25 Z"/>
    <circle cx="132" cy="45" r="4"/>
  </g>

  <!-- QUADRANT 3: HUFFLEPUFF BADGER (Bottom-Left) -->
  <g transform="translate(50, 120) scale(0.32)" fill="url(#inkGrad)">
    <!-- Badger Profile -->
    <path d="M50 85 C65 60, 95 55, 125 65 C155 75, 175 105, 165 135 C155 160, 125 175, 95 170 C65 165, 45 140, 45 115 C45 105, 48 95, 50 85 Z"/>
    <path d="M35 100 L75 80 L115 100 L165 95 L145 130 L115 125 L95 155 L65 140 Z" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- QUADRANT 4: RAVENCLAW EAGLE (Bottom-Right) -->
  <g transform="translate(126, 120) scale(0.32)" fill="url(#inkGrad)">
    <!-- Eagle in Flight -->
    <path d="M100 40 C115 30, 140 35, 155 55 C170 75, 175 110, 160 140 C145 165, 115 175, 90 165 C70 155, 60 135, 65 115 C70 95, 85 85, 100 80 C90 70, 85 55, 100 40 Z"/>
    <path d="M85 70 L150 40 L135 85 L180 90 L140 120 L165 150 L120 140 L105 175 L85 145 Z"/>
  </g>

  <!-- CENTRAL ESCUTCHEON SHIELD WITH 'H' -->
  <path d="M120 78 
           C142 78, 154 88, 154 112 
           C154 148, 138 170, 120 180 
           C102 170, 86 148, 86 112 
           C86 88, 98 78, 120 78 Z" 
        fill="#f4e8c1" stroke="url(#inkGrad)" stroke-width="3.5"/>

  <text x="120" y="145" text-anchor="middle" font-family="'Cinzel Decorative', 'Georgia', serif" font-weight="900" font-size="52" fill="url(#inkGrad)">H</text>

  <!-- BOTTOM MOTTO BANNER RIBBON -->
  <path d="M30 248 
           Q75 272 120 256 
           Q165 272 210 248 
           Q185 275 120 274 
           Q55 275 30 248 Z" 
        fill="#eae0be" stroke="url(#inkGrad)" stroke-width="2.5"/>

  <!-- Motto Text -->
  <text x="120" y="266" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="8.2" font-weight="700" fill="url(#inkGrad)" letter-spacing="1.4">DRACO DORMIENS NUNQUAM TITILLANDUS</text>
</svg>
