<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="wandWoodP" x1="44" y1="44" x2="6" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b120c"/>
      <stop offset="25%" stop-color="#3d2716"/>
      <stop offset="50%" stop-color="#6a4729"/>
      <stop offset="75%" stop-color="#412916"/>
      <stop offset="100%" stop-color="#845c38"/>
    </linearGradient>
    <filter id="lumosFlare" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wand Shaft -->
  <path d="M6 6 L42 42 L40 44 L5 7 Z" fill="url(#wandWoodP)"/>

  <!-- Knots -->
  <circle cx="36" cy="36" r="3.2" fill="url(#wandWoodP)" stroke="#1a0f07" stroke-width="0.8"/>
  <circle cx="28" cy="28" r="2.8" fill="url(#wandWoodP)" stroke="#1a0f07" stroke-width="0.8"/>
  <circle cx="20" cy="20" r="2.3" fill="url(#wandWoodP)" stroke="#1a0f07" stroke-width="0.7"/>
  <circle cx="13" cy="13" r="1.8" fill="url(#wandWoodP)" stroke="#1a0f07" stroke-width="0.6"/>

  <!-- Active Lumos Starburst / Glow at Tip -->
  <circle cx="5" cy="5" r="5" fill="#fca311" opacity="0.4" filter="url(#lumosFlare)"/>
  <circle cx="5" cy="5" r="3" fill="#ffd166" filter="url(#lumosFlare)"/>
  <circle cx="5" cy="5" r="1.5" fill="#ffffff"/>

  <!-- Small cross flares -->
  <line x1="5" y1="1" x2="5" y2="9" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="1" y1="5" x2="9" y2="5" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
</svg>
