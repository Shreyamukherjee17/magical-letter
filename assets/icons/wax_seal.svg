<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Rich Crimson Red Wax Radial Gradient -->
    <radialGradient id="waxBase" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b22222"/>
      <stop offset="35%" stop-color="#800000"/>
      <stop offset="70%" stop-color="#4a0404"/>
      <stop offset="100%" stop-color="#220000"/>
    </radialGradient>

    <!-- Wax Inner Rim Gradient -->
    <radialGradient id="waxInner" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#660a0a"/>
      <stop offset="100%" stop-color="#3d0303"/>
    </radialGradient>

    <!-- Gold Stamped Inlay Gradient -->
    <linearGradient id="stampGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#603e0d"/>
    </linearGradient>

    <!-- Shadow / 3D Bevel Filter -->
    <filter id="waxShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"/>
      <feOffset dx="1" dy="1" result="offset"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.8" specularExponent="10" result="spec">
        <fePointLight x="-50" y="-100" z="200"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceGraphic" operator="in" result="specOut"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="specOut"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Irregular Organic Wax Seal Outer Drips -->
  <path d="M60 4 
           C75 3, 90 12, 100 24 
           C112 38, 118 55, 114 72 
           C111 88, 102 102, 88 110 
           C74 118, 56 117, 42 113 
           C28 109, 14 98, 7 84 
           C0 70, 3 52, 10 38 
           C18 22, 35 10, 52 5 
           C55 4, 58 4, 60 4 Z" 
        fill="url(#waxBase)" 
        filter="url(#waxShadow)"/>

  <!-- Organic Wax Splatter Droplets -->
  <circle cx="108" cy="40" r="4.5" fill="url(#waxBase)"/>
  <circle cx="12" cy="78" r="3.5" fill="url(#waxBase)"/>
  <circle cx="86" cy="112" r="4" fill="url(#waxBase)"/>

  <!-- Stamped Inner Circular Well -->
  <circle cx="60" cy="60" r="40" fill="url(#waxInner)" stroke="#2d0202" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="37.5" fill="none" stroke="url(#stampGold)" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.75"/>

  <!-- Embossed Hogwarts 'H' Crest with Laurel / Stars -->
  <g filter="url(#emboss)">
    <!-- Inner Shield Silhouette -->
    <path d="M60 30 C74 30 84 34 84 48 C84 68 72 82 60 88 C48 82 36 68 36 48 C36 34 46 30 60 30 Z" fill="#4d0606" stroke="url(#stampGold)" stroke-width="1.5"/>
    
    <!-- Central Embossed 'H' -->
    <text x="60" y="66" text-anchor="middle" font-family="'Cinzel Decorative', 'Georgia', serif" font-weight="900" font-size="28" fill="url(#stampGold)">H</text>

    <!-- Laurel Leaves Wreath Base -->
    <path d="M42 78 Q60 88 78 78" stroke="url(#stampGold)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="85" r="1.5" fill="url(#stampGold)"/>
    <circle cx="50" cy="82" r="1.2" fill="url(#stampGold)"/>
    <circle cx="70" cy="82" r="1.2" fill="url(#stampGold)"/>
  </g>

  <!-- Wax Highlight Glaze -->
  <path d="M35 22 C48 14 68 15 82 24 C75 22 55 20 40 26 Z" fill="#ffffff" opacity="0.22"/>
</svg>
