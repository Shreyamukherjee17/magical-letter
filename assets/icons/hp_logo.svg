<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" fill="none">
  <defs>
    <!-- Rich Antiqued Gold Gradient with Metallic Sheen -->
    <linearGradient id="hpGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="15%" stop-color="#e8c872"/>
      <stop offset="45%" stop-color="#ba8c36"/>
      <stop offset="55%" stop-color="#84591a"/>
      <stop offset="85%" stop-color="#caa046"/>
      <stop offset="100%" stop-color="#54370a"/>
    </linearGradient>

    <!-- Warm Mystical Glow Filter -->
    <filter id="magicalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Decorative Castle Spire / Flourish Top Accent -->
    <path d="M300 8 L303 22 L315 25 L303 28 L300 42 L297 28 L285 25 L297 22 Z" fill="url(#hpGold)"/>
    <line x1="160" y1="25" x2="275" y2="25" stroke="url(#hpGold)" stroke-width="1.2" opacity="0.6"/>
    <line x1="325" y1="25" x2="440" y2="25" stroke="url(#hpGold)" stroke-width="1.2" opacity="0.6"/>
    <circle cx="155" cy="25" r="2.5" fill="url(#hpGold)"/>
    <circle cx="445" cy="25" r="2.5" fill="url(#hpGold)"/>

    <!-- Main Wizarding Header Typography -->
    <!-- 'Harry' rendered in classic wizarding styling -->
    <text x="300" y="82" text-anchor="middle" font-family="'Cinzel Decorative', 'Georgia', serif" font-weight="700" font-size="52" fill="url(#hpGold)" letter-spacing="6">HARRY POTTER</text>

    <!-- Subtitle / Chapter Motif -->
    <text x="300" y="116" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="13" font-weight="600" fill="#dfbe7e" letter-spacing="9" opacity="0.85">AND THE ENCHANTED CELEBRATION</text>

    <!-- Bottom Ornate Divider -->
    <path d="M220 135 L300 139 L380 135" stroke="url(#hpGold)" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <polygon points="300,134 304,139 300,144 296,139" fill="url(#hpGold)"/>
  </g>
</svg>
